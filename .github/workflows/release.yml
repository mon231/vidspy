name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            sep: ':'
            icon: ''
            built: dist/vidspy
            asset: vidspy-linux-x64
          - os: windows-latest
            sep: ';'
            icon: '--icon assets/icon.ico'
            built: dist/vidspy.exe
            asset: vidspy-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set version from tag
        shell: bash
        run: echo '__version__ = "'"${GITHUB_REF_NAME#v}"'"' > backend/vidspy_backend/_version.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pytest pyinstaller

      - name: Backend tests
        run: python -m pytest tests -q

      - name: Build single-file executable (no console)
        run: >
          pyinstaller desktop/app.py
          --onefile --noconsole --name vidspy
          --paths backend
          --add-data "desktop/web${{ matrix.sep }}web"
          --collect-data eel
          ${{ matrix.icon }}
          --collect-submodules yt_dlp --collect-submodules gallery_dl

      - name: Name the asset
        shell: bash
        run: mv "${{ matrix.built }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set version from tag
        shell: bash
        run: echo '__version__ = "'"${GITHUB_REF_NAME#v}"'"' > backend/vidspy_backend/_version.py

      - name: Build unsigned release APK
        run: >
          bash ./gradlew assembleRelease
          -PversionName=${GITHUB_REF_NAME#v}
          -PversionCode=${{ github.run_number }}

      - name: Sign APK with signapp
        run: |
          pip install signapp
          # signapp shells out to zipalign and apksigner: use the runner's SDK build-tools
          export PATH="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1):$PATH"
          mkdir -p ~/.reltools
          unsigned=$(ls app/build/outputs/apk/release/*.apk)
          # no -k: signapp signs with its built-in keystore
          signapp -a "$unsigned" -o "vidspy-${GITHUB_REF_NAME}.apk"
          apksigner verify --verbose "vidspy-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: vidspy-apk
          path: vidspy-*.apk
          if-no-files-found: error

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set version from tag
        shell: bash
        run: echo '__version__ = "'"${GITHUB_REF_NAME#v}"'"' > backend/vidspy_backend/_version.py

      - name: Build backend wheel
        run: |
          pip install build
          python -m build backend --outdir dist

      - uses: actions/upload-artifact@v4
        with:
          name: vidspy-wheel
          path: dist/*
          if-no-files-found: error

  release:
    needs: [desktop, android, wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" assets/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
