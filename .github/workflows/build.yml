name: Build vidspy apk
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build APK
        run: bash ./gradlew build

      - name: Sign APK with signapp (same built-in keystore as releases, so it updates in place)
        run: |
          pip install signapp
          export PATH="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1):$PATH"
          unsigned=$(ls app/build/outputs/apk/debug/*.apk)
          signapp -a "$unsigned" -o vidspy-signed.apk
          apksigner verify --verbose vidspy-signed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vidspy-apk
          path: vidspy-signed.apk
