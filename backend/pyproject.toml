[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vidspy-backend"
version = "0.1.0"
description = "Anonymous media resolver/downloader for Instagram, TikTok and LinkedIn"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["vidspy_backend"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
