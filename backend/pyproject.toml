[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vidspy-backend"
description = "Anonymous media resolver/downloader for social-media platforms"
requires-python = ">=3.9"
dynamic = ["version", "dependencies"]

[tool.setuptools]
packages = ["vidspy_backend"]

[tool.setuptools.dynamic]
version = { attr = "vidspy_backend._version.__version__" }
dependencies = { file = ["requirements.txt"] }
