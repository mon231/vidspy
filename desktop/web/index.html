<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vidspy</title>
<link rel="icon" type="image/png" href="favicon.png">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script type="text/javascript" src="/eel.js"></script>
<style>
  body { font: 15px system-ui, sans-serif; margin: 0; padding: 16px; background: #14141a; color: #eee; }
  .row { display: flex; gap: 8px; margin-bottom: 10px; }
  input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #1f1f28; color: #eee; }
  button { padding: 8px 14px; border-radius: 6px; border: 0; background: #6750a4; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #viewer { display: flex; justify-content: center; background: #000; border-radius: 8px; min-height: 120px; }
  video, img { max-width: 100%; max-height: 62vh; }
  #info, #status { margin: 8px 0; color: #aaa; white-space: pre-line; }
  #status.err { color: #ff8a80; }
  dialog { background: #1f1f28; color: #eee; border: 1px solid #444; border-radius: 10px; width: min(560px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  .acc { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #333; }
  .acc .name { flex: 1; } .acc small { display: block; color: #aaa; }
  textarea { width: 100%; box-sizing: border-box; min-height: 120px; margin: 8px 0; background: #14141a; color: #eee;
             border: 1px solid #444; border-radius: 6px; padding: 8px; }
  button.secondary { background: #3a3a48; }
  a.btn { padding: 8px 14px; border-radius: 6px; background: #6750a4; color: #fff; text-decoration: none; font-size: 14px; }
  a.btn.secondary { background: #3a3a48; }
  .badge { display: inline-flex; align-items: center; justify-content: center; border-radius: 22%;
           border: 1px solid #444; flex: none; }
  #connectSteps { padding-left: 20px; color: #ccc; font-size: 13px; }
  #connectSteps li { margin: 6px 0; }
</style>
</head>
<body>
  <h1 style="margin:0 0 12px;font-size:20px;display:flex;align-items:center;gap:10px">
    <img src="favicon.png" alt="" width="32" height="32" style="border-radius:7px">vidspy
    <span style="flex:1"></span><button id="settingsBtn" class="secondary" style="font-size:13px">Accounts</button></h1>
  <div class="row">
    <input id="url" placeholder="Instagram, TikTok, YouTube, X, Facebook, LinkedIn or .m3u8 link" autofocus>
    <button id="go">Watch</button>
  </div>
  <div id="info"></div>
  <div id="viewer"></div>
  <div class="row" id="nav" style="display:none; margin-top:10px">
    <button id="prev">&lt;</button><span id="counter" style="align-self:center"></span><button id="next">&gt;</button>
    <span style="flex:1"></span>
    <button id="dl">Download</button><button id="dlAll">Download all</button>
  </div>
  <div id="status"></div>
  <dialog id="settings">
    <h3 style="margin-top:0">Linked accounts</h3>
    <div style="color:#aaa;font-size:13px">Optional. Connect an account to open posts that need a login. Cookies stay on this computer.</div>
    <div id="accList"></div>
    <div id="connectBox" style="display:none">
      <h4 id="connectTitle" style="margin:14px 0 6px;display:flex;align-items:center;gap:10px"></h4>
      <ol id="connectSteps"></ol>
      <div class="row">
        <a id="loginLink" class="btn" target="_blank" rel="noopener noreferrer"></a>
      </div>
      <textarea id="cookieText" placeholder="Paste the Cookie header value here"></textarea>
      <div class="row"><button id="saveCookies">Save</button><button id="cancelCookies" class="secondary">Cancel</button></div>
      <div id="connectHelp" style="color:#aaa;font-size:12px"></div>
    </div>
    <div id="accStatus" style="min-height:1.2em;color:#aaa"></div>
    <div class="row" style="justify-content:flex-end;margin:8px 0 0"><button id="closeSettings" class="secondary">Close</button></div>
  </dialog>
<script>
let post = null, idx = 0, speed = 1;
function speedPicker(video) {
  const label = document.createElement('label');
  label.style.cssText = 'display:block;margin-top:8px;color:#aaa;font-size:13px';
  label.textContent = 'Speed ';
  const select = document.createElement('select');
  for (const s of [0.5, 0.75, 1, 1.25, 1.5, 2]) select.add(new Option(s + 'x', s, false, s === speed));
  select.onchange = () => { speed = parseFloat(select.value); video.playbackRate = speed; };
  label.append(select);
  return label;
}
const $ = id => document.getElementById(id);
const status = (msg, err) => { $('status').textContent = msg || ''; $('status').className = err ? 'err' : ''; };

async function go() {
  const text = $('url').value.trim();
  if (!text) return;
  status('Resolving…'); $('viewer').innerHTML = '';
  const r = await eel.resolve(text)();
  if (!r.ok) { status(r.error, true); return; }
  post = r.post; idx = 0; status(''); show();
}

function attach(el, src, isHls) {
  if (isHls && window.Hls && Hls.isSupported()) {
    const hls = new Hls(); hls.loadSource(src); hls.attachMedia(el);
    hls.on(Hls.Events.ERROR, (_, d) => d.fatal && status('Cannot play this stream', true));
  } else {
    el.src = src;  // mp4/images, or native HLS (Safari)
  }
}

// The sound can be a separate stream (YouTube, Reddit, ...): play it in an <audio> that follows the video.
function followVideo(video, audio) {
  const jump = () => { if (Math.abs(audio.currentTime - video.currentTime) > 0.3) audio.currentTime = video.currentTime; };
  video.addEventListener('play', () => { jump(); audio.play(); });
  video.addEventListener('playing', () => { jump(); audio.play(); });
  video.addEventListener('pause', () => audio.pause());
  video.addEventListener('waiting', () => audio.pause());
  video.addEventListener('seeked', jump);
  video.addEventListener('timeupdate', jump);
  video.addEventListener('ratechange', () => { audio.playbackRate = video.playbackRate; });
  video.addEventListener('volumechange', () => { audio.volume = video.volume; audio.muted = video.muted; });
}

function show() {
  const item = post.items[idx];
  $('nav').style.display = 'flex';
  $('counter').textContent = `${idx + 1} / ${post.items.length}`;
  $('info').textContent = `${post.platform} · ${item.title}` + (item.note ? `\n${item.note}` : '');
  const el = document.createElement(item.type === 'video' ? 'video' : 'img');
  if (item.type === 'video') { el.controls = true; el.autoplay = true; el.playbackRate = speed; }
  attach(el, item.stream, item.ext === 'm3u8');
  el.onerror = () => status('Cannot play/show this media', true);
  $('viewer').replaceChildren(el);
  if (item.type !== 'video') return;
  el.addEventListener('loadedmetadata', () => { el.playbackRate = speed; });
  if (item.audio_stream) {
    const audio = document.createElement('audio');
    attach(audio, item.audio_stream, item.audio.ext === 'm3u8');
    followVideo(el, audio);
    $('viewer').append(audio);
  }
  $('viewer').append(speedPicker(el));
}

async function save(items) {
  for (const it of items) {
    status('Downloading…');
    const r = await eel.download(it.id)();
    if (!r.ok) { status(r.error, true); return; }
    status('Saved: ' + r.path);
  }
}

let connecting = null;
const badge = (a, size) => `<span class="badge" style="width:${size}px;height:${size}px;background:${a.color}">` +
  `<svg viewBox="0 0 24 24" width="${Math.round(size * .6)}" height="${Math.round(size * .6)}" fill="#fff"><path d="${a.icon}"/></svg></span>`;
const accStatus = (m, err) => { $('accStatus').textContent = m || ''; $('accStatus').style.color = err ? '#ff8a80' : '#aaa'; };

async function loadAccounts() {
  const r = await eel.accounts_list()();
  if (!r.ok) return accStatus(r.error, true);
  $('accList').replaceChildren(...r.data.map(a => {
    const row = document.createElement('div'); row.className = 'acc';
    const state = !a.connected ? 'Not connected' : `Connected (${a.count} cookies)`;
    row.innerHTML = badge(a, 36) + `<div class="name">${a.label}<small>${state}</small></div>`;
    const b = document.createElement('button'); b.textContent = a.connected ? 'Replace' : 'Connect';
    b.onclick = () => {
      connecting = a;
      $('connectTitle').innerHTML = badge(a, 32) + `<span>Connect ${a.label}</span>`;
      $('connectSteps').replaceChildren(...a.steps.map(t => Object.assign(document.createElement('li'), { textContent: t })));
      $('loginLink').href = a.login_url; $('loginLink').textContent = `Open ${a.label} login`;
      $('connectHelp').textContent = a.privacy;
      $('cookieText').value = ''; $('connectBox').style.display = 'block';
      $('connectBox').scrollIntoView({ block: 'nearest' });
    };
    row.append(b);
    if (a.connected) {
      const d = document.createElement('button'); d.className = 'secondary'; d.textContent = 'Remove';
      d.onclick = async () => { await eel.account_disconnect(a.platform)(); accStatus(a.label + ' removed'); loadAccounts(); };
      row.append(d);
    }
    return row;
  }));
}
$('settingsBtn').onclick = () => { accStatus(''); $('connectBox').style.display = 'none'; loadAccounts(); $('settings').showModal(); };
$('closeSettings').onclick = () => $('settings').close();
$('cancelCookies').onclick = () => { $('connectBox').style.display = 'none'; };
$('saveCookies').onclick = async () => {
  const r = await eel.account_connect(connecting.platform, $('cookieText').value)();
  if (!r.ok) return accStatus(r.error, true);
  $('connectBox').style.display = 'none';
  accStatus(connecting.label + ' connected');
  loadAccounts();
};

$('go').onclick = go;
$('url').onkeydown = e => { if (e.key === 'Enter') go(); };
$('prev').onclick = () => { idx = (idx - 1 + post.items.length) % post.items.length; show(); };
$('next').onclick = () => { idx = (idx + 1) % post.items.length; show(); };
$('dl').onclick = () => save([post.items[idx]]);
$('dlAll').onclick = () => save(post.items);
</script>
</body>
</html>
